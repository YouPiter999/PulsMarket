name: Deploy to Firebase Hosting

# Автодеплой: при каждом пуше в main собираем проект и деплоим на Firebase Hosting.
on:
  push:
    branches:
      - main
  workflow_dispatch: {} # позволяет запустить деплой вручную из вкладки Actions

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project pulsemarket-group-app --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
